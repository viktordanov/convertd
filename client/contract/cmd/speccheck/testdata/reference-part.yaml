# A part of api/openapi.yaml, copied for the speccheck compare tests and the
# 3.1 transport self-tests: every path but /metrics, and every schema.
# emitted-part.json is a hand-made OpenAPI 3.1 translation of it, written
# the way utoipa emits a spec.
openapi: 3.0.3

info:
  title: Convert API
  version: 1.0.0-draft.1
  description: |
    Converts office documents, PDFs and images into a standard PDF and per-page
    images.

    One call does the whole job. Upload a file, say what you want back, and
    receive either the PDF itself or a ZIP bundle holding the PDF, the page
    images and a `manifest.json` that describes them.

    ## Authentication

    Every `/v1` route needs the service API key as a bearer token:

    ```
    Authorization: Bearer <API_KEY>
    ```

    The probes (`/healthz`, `/readyz`) take no key.

    ## Calling it

    ```bash
    # Office document to PDF (the default output)
    curl -sS -H "Authorization: Bearer $CONVERT_API_KEY" \
      -F file=@deck.pptx \
      -o deck.pdf \
      "$CONVERT_HOST/v1/convert"

    # PDF plus page images at 150 DPI, as one ZIP bundle
    curl -sS -H "Authorization: Bearer $CONVERT_API_KEY" \
      -F file=@deck.pptx \
      -F 'options={"output":"bundle","images":{"format":"jpeg","dpi":150}};type=application/json' \
      -o deck.zip \
      "$CONVERT_HOST/v1/convert"

    # First page of an existing PDF as a small thumbnail
    curl -sS -H "Authorization: Bearer $CONVERT_API_KEY" \
      -F file=@report.pdf \
      -F 'options={"output":"images","pages":"1","images":{"format":"webp","dpi":72,"max_edge":320}};type=application/json' \
      -o thumb.zip \
      "$CONVERT_HOST/v1/convert"
    ```

    ## What comes back

    The `output` option decides the response. Each value maps to exactly one
    content type:

    | `output` | Response | Contents |
    | --- | --- | --- |
    | `pdf` (default) | `application/pdf` | The PDF. Metadata travels in `Convert-*` headers. |
    | `images` | `application/zip` | `manifest.json` and `pages/NNNN.<ext>` |
    | `bundle` | `application/zip` | `manifest.json`, `document.pdf` and `pages/NNNN.<ext>` |

    The response is only sent once the whole job has succeeded, so a `200`
    always carries a complete result and every failure has a proper status
    code and JSON error body.

    ## Errors and retries

    Every error body is `{"error": "<message>", "code": "<CODE>"}`.

    | Status | Codes | Retry? |
    | --- | --- | --- |
    | 400 | `BAD_REQUEST` | No. The request is malformed. |
    | 401 | `UNAUTHORIZED` | No. |
    | 413 | `FILE_TOO_LARGE` | No. |
    | 415 | `UNSUPPORTED_FORMAT` | No. |
    | 422 | `VALIDATION_ERROR`, `PASSWORD_REQUIRED`, `INVALID_PASSWORD`, `LIMIT_EXCEEDED`, `CONVERSION_FAILED` | No. The same input will fail the same way. |
    | 429 | `TOO_MANY_REQUESTS` | Yes, after `Retry-After` seconds. |
    | 500 | `INTERNAL_ERROR` | Yes, with backoff. |
    | 503 | `SERVICE_UNAVAILABLE` | Yes, after `Retry-After` seconds. |
    | 504 | `CONVERSION_TIMEOUT` | Once at most. A second timeout means the document is too heavy for the budget. |

    The service already retries a crashed engine once on a fresh worker, so
    `CONVERSION_FAILED` is final.

    ## Determinism and caching

    The service keeps no state and stores nothing after the response is sent.
    The same file, options and engine build produce the same output, so callers
    can cache results under `sha256(file) + options + Convert-Engine-Fingerprint`.
    The fingerprint changes whenever output could change: a new service
    version, LibreOffice version, PDFium version or font set.

  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: conversion
    description: The one endpoint that does the work.
  - name: discovery
    description: What this deployment supports.
  - name: operations
    description: Probes and metrics for the platform. No API key.

security:
  - ApiKeyBearer: []

paths:
  /v1/convert:
    post:
      operationId: convertDocument
      tags: [conversion]
      summary: Convert one document to PDF, page images, or both
      description: |
        Uploads one file and returns it as a PDF, as page images, or as a
        bundle of both.

        **Routing.** The file type is detected from the bytes, never from the
        file name or the part's content type. Office and OpenDocument files go
        through LibreOffice. PDFs skip conversion and go straight to rendering.
        Images are wrapped into a PDF with one page per image frame.

        **Options.** Send them as a JSON object in the `options` part. Leave
        the part out to get a PDF with default settings. Unknown properties
        are rejected with `VALIDATION_ERROR` so that typos never pass silently.

        **Timing.** The call is synchronous. `timeout_seconds` is the whole
        budget for queueing, conversion, rendering and packaging. When it runs
        out the engine process is killed and the call returns
        `CONVERSION_TIMEOUT`.

        **Safety.** Macros never run, external links are never fetched and the
        engine has no network access. A document that relies on any of those
        still converts, without that content.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConvertRequest'
            encoding:
              file:
                contentType: application/octet-stream
              options:
                contentType: application/json
      responses:
        '200':
          description: |
            The conversion succeeded. The content type follows the `output`
            option: `application/pdf` for `pdf`, `application/zip` for
            `images` and `bundle`.

            The ZIP is laid out as:

            ```
            manifest.json        described by the Manifest schema
            document.pdf         only for output=bundle
            pages/0001.jpg       one file per rendered page, 1-based, zero-padded
            pages/0002.jpg
            ```

            Images and the PDF are stored without further compression.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Content-Disposition:
              description: '`attachment` with a file name derived from the upload, for example `deck.pdf` or `deck.zip`.'
              schema:
                type: string
              example: attachment; filename="deck.pdf"
            Convert-Source-Format:
              description: The detected input format, as listed by `/v1/capabilities`.
              schema:
                type: string
              example: pptx
            Convert-Page-Count:
              description: Number of pages in the resulting PDF.
              schema:
                type: integer
                minimum: 1
              example: 12
            Convert-Warning-Count:
              description: |
                Number of warnings raised for this conversion. The warnings
                themselves are in `manifest.json`; ask for `bundle` to read them.
              schema:
                type: integer
                minimum: 0
              example: 0
            Convert-Engine-Fingerprint:
              $ref: '#/components/headers/Convert-Engine-Fingerprint'
            Server-Timing:
              $ref: '#/components/headers/Server-Timing'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/zstd:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/FileTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedFormat'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/ConversionTimeout'

  /v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [discovery]
      summary: List supported formats, limits and engine versions
      description: |
        Describes what this deployment can do: which input formats it accepts,
        which outputs it produces, the limits it enforces, the engine versions
        it runs and the fonts it has installed.

        The answer is fixed for the lifetime of a deployment, so clients can
        read it once at start-up.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The capabilities of this deployment.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /healthz:
    get:
      operationId: getLiveness
      tags: [operations]
      summary: Liveness probe
      description: Returns 200 while the supervisor process is running. Checks nothing else.
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /readyz:
    get:
      operationId: getReadiness
      tags: [operations]
      summary: Readiness probe
      description: |
        Returns 200 when every worker pool has at least one warm worker and
        the service is not shutting down. Returns 503 while starting, while
        draining, or when a pool has no healthy worker.
      security: []
      responses:
        '200':
          description: Ready to take conversions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready. Do not route traffic here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'

components:
  securitySchemes:
    ApiKeyBearer:
      type: http
      scheme: bearer
      description: 'The service API key, sent as `Authorization: Bearer <API_KEY>`.'

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Correlation ID. If present it is echoed in the response, the logs and
        the manifest. If absent the service generates one.
      schema:
        type: string
        maxLength: 128
      example: 7f3c2a9e-4b1d-4f6a-9a51-0c2e8d7b6a14

  headers:
    X-Request-ID:
      description: The correlation ID of this request.
      schema:
        type: string
      example: 7f3c2a9e-4b1d-4f6a-9a51-0c2e8d7b6a14
    Convert-Engine-Fingerprint:
      description: |
        Identifies the exact engine build: service version, LibreOffice
        version, PDFium version and installed font set. Use it in cache keys.
      schema:
        type: string
      example: sha256:5b0f6e1c9a2d
    Server-Timing:
      description: |
        Where the time of this request went, in the W3C Server-Timing form
        `name;dur=<milliseconds>`, comma-separated, with 3 decimals. It is
        sent on every response produced after the file type was detected,
        including the error responses that follow detection. It is meant for
        diagnosis and benchmarks.

        | Name | Stage |
        | --- | --- |
        | `recv` | Receiving the upload. Outside `total`. |
        | `detect` | Detecting the file type. |
        | `preflight` | Scanning the source before conversion. Runs alongside `convert`. |
        | `queue` | Waiting for a free worker. |
        | `lease` | Taking the worker from its pool. |
        | `spawn` | Starting a worker on this request's path. 0 when a warm worker was used. |
        | `bind` | Loading the engine library in that worker. 0 when a warm worker was used. |
        | `convert`, `convert_engine` | Producing the PDF: wall time, then time inside the engine. |
        | `inspect`, `inspect_engine` | Reading the PDF's facts: wall time, then engine time. |
        | `probe`, `probe_engine` | The blank-page probe: wall time, then engine time. |
        | `render`, `render_engine` | Rendering page images: wall time, then engine time (the longest chunk). |
        | `verify` | The quality checks that raise warnings. |
        | `package` | Building the manifest and the ZIP plan before the headers are sent. |
        | `total` | From the end of the upload to the start of the response. |

        Stages that did not run are left out, except `spawn` and `bind`.
      schema:
        type: string
      example: recv;dur=4.210, detect;dur=0.031, queue;dur=0.004, lease;dur=0.012, spawn;dur=0.000, bind;dur=0.000, convert;dur=812.442, convert_engine;dur=809.118, verify;dur=1.305, package;dur=0.088, total;dur=815.901
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
      example: 5

  responses:
    BadRequest:
      description: The request is malformed, for example no `file` part or `options` is not valid JSON.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: missing multipart part "file"
            code: BAD_REQUEST
    Unauthorized:
      description: The API key is missing or wrong.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: missing or invalid API key
            code: UNAUTHORIZED
    FileTooLarge:
      description: The upload exceeds `limits.max_upload_bytes`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: file exceeds the 125829120 byte limit
            code: FILE_TOO_LARGE
    UnsupportedFormat:
      description: |
        The detected file type is not on the allow-list. The message names
        what was detected. `/v1/capabilities` lists what is accepted.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'unsupported format: html'
            code: UNSUPPORTED_FORMAT
    Unprocessable:
      description: |
        The request was understood but cannot be carried out for this input.
        Retrying the same request will fail the same way.

        | Code | Meaning |
        | --- | --- |
        | `VALIDATION_ERROR` | An option is out of range, unknown, or `pages` selects nothing. |
        | `PASSWORD_REQUIRED` | The file is encrypted and no `password` was sent. |
        | `INVALID_PASSWORD` | The `password` does not open the file. |
        | `LIMIT_EXCEEDED` | The job would exceed a server limit, for example more pages to render than `limits.max_render_pages`. |
        | `CONVERSION_FAILED` | The engine could not convert the document. It is corrupt, or it crashed the engine twice. |
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              summary: Option out of range
              value:
                error: images.dpi must be between 36 and 600
                code: VALIDATION_ERROR
            passwordRequired:
              summary: Encrypted file without a password
              value:
                error: the document is encrypted and no password was provided
                code: PASSWORD_REQUIRED
            conversionFailed:
              summary: The engine could not convert the file
              value:
                error: the document could not be converted
                code: CONVERSION_FAILED
    TooManyRequests:
      description: All workers are busy and the wait queue is full. Retry after the indicated delay.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: the conversion queue is full
            code: TOO_MANY_REQUESTS
    InternalError:
      description: An unexpected failure inside the service. Details are logged under the request ID and not returned.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal server error
            code: INTERNAL_ERROR
    ServiceUnavailable:
      description: The service is starting, draining for shutdown, or has no healthy worker.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: the service is not ready
            code: SERVICE_UNAVAILABLE
    ConversionTimeout:
      description: |
        The job did not finish within `timeout_seconds`. The engine process
        was killed and replaced.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: the conversion did not finish within 120 seconds
            code: CONVERSION_TIMEOUT

  schemas:
    ConvertRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: |
            The document to convert. The part's file name is used only to name
            the response and is echoed in the manifest. The type is detected
            from the bytes.
        options:
          $ref: '#/components/schemas/ConvertOptions'

    ConvertOptions:
      type: object
      additionalProperties: false
      description: |
        What to produce and how. Every property is optional. An empty object,
        or no `options` part at all, returns a PDF with default settings.
      properties:
        output:
          allOf:
            - $ref: '#/components/schemas/OutputKind'
          default: pdf
        pages:
          type: string
          pattern: '^[0-9]+(-[0-9]*)?(,[0-9]+(-[0-9]*)?)*$'
          maxLength: 256
          description: |
            Which pages to render as images, 1-based. A comma-separated list of
            single pages (`3`), closed ranges (`1-5`) and open ranges (`10-`).
            Pages past the end of the document are ignored. If nothing is
            left the call fails with `VALIDATION_ERROR`.

            Applies to `images` and `bundle`. The PDF always holds every page.
            Default: all pages.
          example: 1-5,8,10-
        password:
          type: string
          maxLength: 256
          writeOnly: true
          description: |
            Password for an encrypted input. It is used once to open the file,
            never logged and never stored. The resulting PDF is not encrypted.
        timeout_seconds:
          type: integer
          minimum: 5
          maximum: 210
          default: 120
          description: |
            Total time budget for this call, in seconds. Covers waiting for a
            worker, conversion, rendering and packaging. The server caps it at
            `limits.max_timeout_seconds`.
        images:
          $ref: '#/components/schemas/ImageOptions'
        slides:
          $ref: '#/components/schemas/SlideOptions'
        sheets:
          $ref: '#/components/schemas/SheetOptions'
      example:
        output: bundle
        pages: 1-20
        images:
          format: jpeg
          dpi: 150
          quality: 85
          max_edge: 2576

    OutputKind:
      type: string
      enum: [pdf, images, bundle]
      description: |
        What the response contains.

        - `pdf`: the PDF, as `application/pdf`.
        - `images`: page images and a manifest, as `application/zip`.
        - `bundle`: the PDF, page images and a manifest, as `application/zip`.

    ImageOptions:
      type: object
      additionalProperties: false
      description: How pages are rendered to images. Used by `images` and `bundle`.
      properties:
        format:
          allOf:
            - $ref: '#/components/schemas/ImageFormat'
          default: jpeg
        dpi:
          type: integer
          minimum: 36
          maximum: 600
          default: 150
          description: |
            Render resolution in dots per inch. A US Letter page is
            1275 x 1650 px at 150 DPI. The server caps it at `limits.max_dpi`.
        quality:
          type: integer
          minimum: 1
          maximum: 100
          default: 85
          description: Encoder quality for `jpeg` and `webp`. Ignored for `png`.
        max_edge:
          type: integer
          minimum: 64
          maximum: 8192
          description: |
            Longest allowed edge of an image, in pixels. A page that would be
            larger is rendered at a lower resolution so that it fits, keeping
            its aspect ratio. Unset means no clamp beyond `limits.max_edge_px`.

    ImageFormat:
      type: string
      enum: [jpeg, png, webp]
      description: |
        Image encoding.

        - `jpeg`: smallest and fastest. Best for photos, slides and model input.
        - `png`: lossless. Larger and slower to encode.
        - `webp`: smaller than JPEG at similar quality. Slower to encode.

    SlideOptions:
      type: object
      additionalProperties: false
      description: Options that only affect presentations.
      properties:
        include_hidden:
          type: boolean
          default: false
          description: Also export slides that are marked hidden.
        notes:
          allOf:
            - $ref: '#/components/schemas/SlideNotes'
          default: none

    SlideNotes:
      type: string
      enum: [none, append, only]
      description: |
        What to do with speaker notes.

        - `none`: slides only.
        - `append`: all slides, followed by one notes page per slide.
        - `only`: notes pages only.

    SheetOptions:
      type: object
      additionalProperties: false
      description: Options that only affect spreadsheets.
      properties:
        one_page_per_sheet:
          type: boolean
          default: false
          description: |
            Put each sheet on a single page sized to its content, instead of
            splitting it across pages by its print layout.

    Manifest:
      type: object
      description: |
        The `manifest.json` at the root of every ZIP response. It describes
        the source, the PDF, each rendered page and anything the service
        noticed during conversion.
      required:
        - manifest_version
        - request_id
        - source
        - page_count
        - pages
        - warnings
        - engine
        - timings_ms
      properties:
        manifest_version:
          type: integer
          enum: [1]
          description: Version of this manifest layout.
        request_id:
          type: string
          description: The correlation ID of the request that produced this bundle.
        source:
          $ref: '#/components/schemas/SourceInfo'
        page_count:
          type: integer
          minimum: 1
          description: Number of pages in the PDF, whether or not all were rendered.
        pdf:
          $ref: '#/components/schemas/PdfInfo'
        images:
          $ref: '#/components/schemas/ImageSettings'
        pages:
          type: array
          description: One entry per rendered page, in page order.
          items:
            $ref: '#/components/schemas/PageInfo'
        warnings:
          type: array
          description: Things the service noticed that may affect quality. Empty when all checks passed.
          items:
            $ref: '#/components/schemas/Warning'
        engine:
          $ref: '#/components/schemas/EngineInfo'
        timings_ms:
          $ref: '#/components/schemas/Timings'
      example:
        manifest_version: 1
        request_id: 7f3c2a9e-4b1d-4f6a-9a51-0c2e8d7b6a14
        source:
          filename: deck.pptx
          format: pptx
          family: presentation
          size_bytes: 4821337
          sha256: 9f2c6c1e0a4b7d3f5e8a1b2c3d4e5f60718293a4b5c6d7e8f901122334455667
          encrypted: false
        page_count: 2
        pdf:
          path: document.pdf
          size_bytes: 1203344
          origin: converted
        images:
          format: jpeg
          dpi: 150
          quality: 85
        pages:
          - number: 1
            path: pages/0001.jpg
            width_px: 2000
            height_px: 1125
            width_pt: 960
            height_pt: 540
            size_bytes: 184220
            blank: false
          - number: 2
            path: pages/0002.jpg
            width_px: 2000
            height_px: 1125
            width_pt: 960
            height_pt: 540
            size_bytes: 201877
            blank: false
        warnings:
          - code: FONT_SUBSTITUTED
            message: Aptos is not installed and was replaced by Carlito
            detail:
              requested: Aptos
              substitute: Carlito
        engine:
          service_version: 1.0.0
          libreoffice: 26.8.3.2
          pdfium: '8125'
          fingerprint: sha256:5b0f6e1c9a2d
        timings_ms:
          queue: 3
          convert: 812
          render: 240
          total: 1071

    SourceInfo:
      type: object
      description: What was uploaded.
      required: [format, family, size_bytes, sha256, encrypted]
      properties:
        filename:
          type: string
          description: The file name sent with the upload, if any.
        format:
          type: string
          description: The detected format, as listed by `/v1/capabilities`.
          example: pptx
        family:
          $ref: '#/components/schemas/FormatFamily'
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the uploaded bytes, in lowercase hex.
        encrypted:
          type: boolean
          description: Whether the upload was password-protected.

    FormatFamily:
      type: string
      enum: [document, presentation, spreadsheet, pdf, image]
      description: The broad kind of input, which decides how it is routed.

    PdfInfo:
      type: object
      description: The PDF inside a `bundle`. Absent for `images`.
      required: [path, size_bytes, origin]
      properties:
        path:
          type: string
          description: Path of the PDF inside the ZIP.
          example: document.pdf
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        origin:
          type: string
          enum: [converted, passthrough, assembled]
          description: |
            How the PDF came to be.

            - `converted`: produced by LibreOffice from an office file.
            - `passthrough`: the upload was already a PDF and is returned unchanged, or decrypted when it was encrypted.
            - `assembled`: built from an uploaded image.

    ImageSettings:
      type: object
      description: The image settings that were actually applied, after defaults and server caps.
      required: [format, dpi]
      properties:
        format:
          $ref: '#/components/schemas/ImageFormat'
        dpi:
          type: integer
        quality:
          type: integer
        max_edge:
          type: integer

    PageInfo:
      type: object
      description: One rendered page.
      required: [number, path, width_px, height_px, width_pt, height_pt, size_bytes, blank]
      properties:
        number:
          type: integer
          minimum: 1
          description: 1-based page number in the PDF.
        path:
          type: string
          description: Path of the image inside the ZIP.
          example: pages/0001.jpg
        width_px:
          type: integer
          minimum: 1
        height_px:
          type: integer
          minimum: 1
        width_pt:
          type: number
          description: Page width in PDF points (1/72 inch).
        height_pt:
          type: number
          description: Page height in PDF points (1/72 inch).
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        blank:
          type: boolean
          description: True when the rendered page is a single flat colour.

    Warning:
      type: object
      description: A quality signal. Warnings never fail the request.
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/WarningCode'
        message:
          type: string
          description: A human-readable sentence.
        page:
          type: integer
          minimum: 1
          description: The page the warning is about, when it concerns one page.
        detail:
          type: object
          additionalProperties: true
          description: Structured data for the warning. Its keys depend on `code`.

    WarningCode:
      type: string
      enum:
        - FONT_SUBSTITUTED
        - PAGE_COUNT_MISMATCH
        - BLANK_PAGE
        - MACROS_IGNORED
        - RENDER_CLAMPED
      description: |
        - `FONT_SUBSTITUTED`: a font the document asks for is not installed.
          Text may reflow. `detail` has `requested` and `substitute`.
        - `PAGE_COUNT_MISMATCH`: the PDF has a different number of pages than
          the source declares. `detail` has `expected` and `actual`.
        - `BLANK_PAGE`: a page that contains content rendered as a flat colour.
        - `MACROS_IGNORED`: the document contains macros. They were not run.
        - `RENDER_CLAMPED`: a server limit reduced the requested resolution.
          `detail` has `requested_dpi` and `effective_dpi`.

    EngineInfo:
      type: object
      description: The software that produced the result.
      required: [service_version, pdfium, fingerprint]
      properties:
        service_version:
          type: string
          example: 1.0.0
        libreoffice:
          type: string
          description: LibreOffice version. Absent from a manifest when LibreOffice was not used.
          example: 26.8.3.2
        pdfium:
          type: string
          description: PDFium build number.
          example: '8125'
        fingerprint:
          type: string
          description: Same value as the `Convert-Engine-Fingerprint` header.
          example: sha256:5b0f6e1c9a2d

    Timings:
      type: object
      description: Where the time went, in milliseconds.
      required: [queue, convert, render, total]
      properties:
        queue:
          type: integer
          minimum: 0
          description: Waiting for a free worker.
        convert:
          type: integer
          minimum: 0
          description: Producing the PDF. Zero for PDF uploads.
        render:
          type: integer
          minimum: 0
          description: Rendering and encoding page images.
        total:
          type: integer
          minimum: 0
          description: From the end of the upload to the start of the response.

    Capabilities:
      type: object
      required: [service, engine, inputs, outputs, image_formats, limits, fonts]
      properties:
        service:
          $ref: '#/components/schemas/ServiceInfo'
        engine:
          $ref: '#/components/schemas/EngineInfo'
        inputs:
          type: array
          description: Every input format this deployment accepts.
          items:
            $ref: '#/components/schemas/InputFormat'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/OutputKind'
        image_formats:
          type: array
          items:
            $ref: '#/components/schemas/ImageFormat'
        limits:
          $ref: '#/components/schemas/Limits'
        fonts:
          type: array
          description: Installed font families, sorted by name.
          items:
            type: string
          example: [Caladea, Carlito, DejaVu Sans, Liberation Sans, Noto Sans]

    ServiceInfo:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          example: convert
        version:
          type: string
          example: 1.0.0
        commit:
          type: string
          description: Git commit the binary was built from.
          example: 3f9c2ab

    InputFormat:
      type: object
      required: [format, family, extensions, media_types, engine]
      properties:
        format:
          type: string
          description: Short identifier, used in `Convert-Source-Format` and the manifest.
          example: docx
        family:
          $ref: '#/components/schemas/FormatFamily'
        extensions:
          type: array
          items:
            type: string
          example: [docx]
        media_types:
          type: array
          items:
            type: string
          example: [application/vnd.openxmlformats-officedocument.wordprocessingml.document]
        engine:
          type: string
          enum: [libreoffice, pdfium, image]
          description: Which engine turns this format into a PDF. `pdfium` means the file already is one.

    Limits:
      type: object
      required:
        - max_upload_bytes
        - max_render_pages
        - max_dpi
        - max_edge_px
        - default_timeout_seconds
        - max_timeout_seconds
      properties:
        max_upload_bytes:
          type: integer
          format: int64
          example: 125829120
        max_render_pages:
          type: integer
          description: Most pages one call may render to images.
          example: 500
        max_dpi:
          type: integer
          example: 300
        max_edge_px:
          type: integer
          example: 4096
        default_timeout_seconds:
          type: integer
          example: 120
        max_timeout_seconds:
          type: integer
          example: 210

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Readiness:
      type: object
      required: [status, pools]
      properties:
        status:
          type: string
          enum: [ready, starting, draining, degraded]
          description: |
            - `ready`: taking conversions.
            - `starting`: workers are still warming up.
            - `draining`: shutting down; in-flight jobs are finishing.
            - `degraded`: a pool has no healthy worker.
        pools:
          type: object
          required: [office, render]
          properties:
            office:
              $ref: '#/components/schemas/PoolStatus'
            render:
              $ref: '#/components/schemas/PoolStatus'

    PoolStatus:
      type: object
      required: [target, idle, busy]
      properties:
        target:
          type: integer
          minimum: 0
          description: Configured number of workers.
        idle:
          type: integer
          minimum: 0
          description: Warm workers waiting for a job.
        busy:
          type: integer
          minimum: 0
          description: Workers running a job.

    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: A human-readable message. Safe to log; never contains document content.
          example: 'unsupported format: html'
        code:
          $ref: '#/components/schemas/ErrorCode'

    ErrorCode:
      type: string
      enum:
        - BAD_REQUEST
        - UNAUTHORIZED
        - NOT_FOUND
        - FILE_TOO_LARGE
        - UNSUPPORTED_FORMAT
        - VALIDATION_ERROR
        - PASSWORD_REQUIRED
        - INVALID_PASSWORD
        - LIMIT_EXCEEDED
        - CONVERSION_FAILED
        - TOO_MANY_REQUESTS
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - CONVERSION_TIMEOUT
      description: Stable machine-readable error code. Branch on this, not on the message.
