# Installed as /etc/dpkg/dpkg.cfg.d/91-rs-convert-fonts (product and dev, so both see the same
# families). Keeps only the Noto families PLAN.md names. The fc-list gate in install-engines.sh
# fails the build if a promised family is missing.
path-exclude=/usr/share/fonts/truetype/noto/*
path-include=/usr/share/fonts/truetype/noto/NotoSansMono-*
path-include=/usr/share/fonts/truetype/noto/NotoSansSymbols-*
path-include=/usr/share/fonts/truetype/noto/NotoSansSymbols2-*
path-include=/usr/share/fonts/truetype/noto/NotoSansMath-*
path-include=/usr/share/fonts/truetype/noto/NotoColorEmoji*

# Duplicate fonts: LibreOffice's ooofonts ship the same families. On 26.8.3.1 fontconfig picks
# LibreOffice's copy of each of these (the same version, or a newer one: Caladea 65602 against
# 65601, Noto Sans and Serif 132055 against 131334), so the Debian files never render. The
# packages stay for their fontconfig rules; only the font files go. Noto Sans and Noto Serif
# come only from LibreOffice now, which is why they are not included above.
# docker/dpkg/libreoffice.cfg drops the one family where Debian's copy wins, Carlito.
path-exclude=/usr/share/fonts/truetype/liberation/*
path-exclude=/usr/share/fonts/truetype/dejavu/*
path-exclude=/usr/share/fonts/truetype/crosextra/Caladea-*
