# Installed as /etc/dpkg/dpkg.cfg.d/91-rs-convert-fonts (product and dev,
# so both see the same families). Keeps only the Noto families PLAN.md names. File names in
# trixie's fonts-noto-core are unverified; the fc-list gate in install-engines.sh catches a miss.
path-exclude=/usr/share/fonts/truetype/noto/*
path-include=/usr/share/fonts/truetype/noto/NotoSans-*
path-include=/usr/share/fonts/truetype/noto/NotoSerif-*
path-include=/usr/share/fonts/truetype/noto/NotoSansMono-*
path-include=/usr/share/fonts/truetype/noto/NotoSansSymbols-*
path-include=/usr/share/fonts/truetype/noto/NotoSansSymbols2-*
path-include=/usr/share/fonts/truetype/noto/NotoSansMath-*
path-include=/usr/share/fonts/truetype/noto/NotoColorEmoji*
