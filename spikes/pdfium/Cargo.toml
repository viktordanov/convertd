[package]
name = "spike-pdfium"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
pdfium-render = { version = "0.9.6", default-features = false, features = ["pdfium_latest", "image_latest"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-encoder = "0.7"
webp = "0.3"
