# deploy/k8s/overlays/gvisor/runtimeclass.yaml. Cluster-scoped and NOT in the
# overlay's resources: apply it once, and only if the cluster has no such class yet.
# The handler name must match the containerd runtime configured for runsc on the nodes.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
# overhead:                 # set from the step 10 measurement of the sandbox's own memory
#   podFixed:
#     memory: 128Mi
#     cpu: 100m
