# CI for the image and the deployment files (ledger item 003, INTERFACES.md §14).
# This workflow builds and tests; it never pushes. A tag v<x.y.z> runs release.yml, which
# runs the same gates (.github/actions/image-gates) and then publishes the image to GHCR and
# a GitHub release. The image job runs by hand, monthly, and on pushes to main and pull
# requests that touch the image or the engine code (the changes job decides).
# Actions are pinned by commit SHA (the tag is in the comment); tools by version and SHA-256.
name: image

on:
  # Docs-only changes (ledger, guidance, READMEs, memoria.lock, agent skills) skip this
  # workflow; memoria.yml checks them.
  pull_request:
    paths-ignore: ["**.md", "docs/**", "memoria.lock", ".claude/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "memoria.lock", ".claude/**"]
  schedule:
    - cron: "0 4 1 * *"      # monthly rebuild and scan: Debian security updates, broken pins
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. Pushes to main queue instead:
# the changes job compares each push only with the commit before it, so a cancelled run would
# lose the image check of its push. GitHub keeps one pending run per group, so a third push
# while one runs and one waits still replaces the waiting one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# For the Rust jobs; the image job ignores them.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash          # bash -eo pipefail: a failing smoke or kubeconform fails through pipes

jobs:
  # Rust checks run as two parallel jobs with a shared dependency cache. Debug info and
  # incremental builds are off in CI: they cost build time and nothing reads them here.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup is on the runner; rust-toolchain.toml pins the channel and components.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features test-hooks -- -D warnings

  test:
    # One test run, with the test hooks: it is a superset of the plain build's tests, and
    # clippy above already proves the plain build compiles. Tests named slow_* run only in
    # test-full. nextest kills a test after 60 s (.config/nextest.toml, profile ci).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-nextest@0.9.152
      - name: Test
        run: cargo nextest run --locked --features test-hooks --profile ci
      - name: Doc tests
        run: cargo test --locked --features test-hooks --doc
      # The Go steps reuse the test-hooks convertd that the tests above built, so
      # neither generate.sh nor contract_test.sh compiles Rust again.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: |
            client/go.sum
            client/contract/go.sum
      - name: Generated files are current
        run: ./generate.sh --check
      - name: Contract tests (level A fake)
        run: scripts/contract_test.sh

  test-full:
    # Every test, including slow_*: by hand and monthly.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-nextest@0.9.152
      - name: Test
        run: cargo nextest run --locked --features test-hooks --profile full

  changes:
    # Decides whether a push to main or a pull request needs the image job: it does when it
    # touches the image or the code that runs the engines. A path filter on the workflow cannot
    # do this per job. A push compares with its `before` commit; a pull request with its base.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          # A branch's first push has an all-zeros `before`, and a force push can name a commit
          # that is no longer in the history. Neither gives a diff, so both run the image job.
          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no base commit to compare with (${BASE:-none}): image=true"
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request compares with the merge base (three dots): only its own changes. A push
          # compares the two commits directly (two dots). With three dots, a force push back to an
          # ancestor would compare with the merge base, which is the new tip, and find nothing.
          if [[ "${EVENT}" == pull_request ]]; then
            changed="$(git diff --name-only "${BASE}...${HEAD}")"
          else
            changed="$(git diff --name-only "${BASE}" "${HEAD}")"
          fi
          printf '%s\n' "${changed}"
          if grep -E '^(docker/|src/engines/|src/worker/|src/preflight/|corpus/|\.github/actions/image-gates/)|^Cargo\.lock$' \
               <<<"${changed}" >/dev/null; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    # By hand, monthly, and on the pushes and pull requests that the changes job selects. It
    # builds the image natively on each arch, runs the smoke test and the corpus check.
    # The engine test suites stay out of it: they run monthly or by hand (lead's ruling,
    # 2026-11-26).
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch'
          || github.event_name == 'schedule' || needs.changes.outputs.image == 'true') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}   # native: no emulation anywhere in CI
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Guard: build from a checkout with the modes that umask 077 gives, so a COPY without
      # --chmod, or a test that reads the checkout as another user, fails here and not on a
      # deploy. A COPY that kept the 0600 mode once left /etc/convertd/fonts.json unreadable.
      - name: Make the checkout private (umask 077 modes)
        run: chmod -R go-rwx "${GITHUB_WORKSPACE}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # build-push-action, not a `run:` step: the gha cache needs the runtime token it provides.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          build-args: |
            CARGO_JOBS=4
            CONVERTD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          load: true
          push: false
          tags: rs-convert:ci
      # The smoke test and the corpus check, shared with release.yml.
      - uses: ./.github/actions/image-gates
        with:
          image: rs-convert:ci
          arch: ${{ matrix.arch }}
          max-mb: ${{ vars.IMAGE_MAX_MB || 635 }}
      - name: Scan (monthly, report only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {image-ref: "rs-convert:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1"}

  manifests:
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # Pinned, so a runner image update cannot change the result (review finding 3).
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tgz -C /usr/local/bin kubeconform
      - name: Kubernetes manifests render and validate
        run: |
          for o in deploy/k8s/base deploy/k8s/overlays/gvisor; do
            kubectl kustomize "$o" | kubeconform -strict -summary -
          done
          kubeconform -strict -summary deploy/k8s/overlays/gvisor/runtimeclass.yaml
      - name: Install shellcheck
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Shell scripts
        run: /usr/local/bin/shellcheck build_docker.sh docker/*.sh generate.sh scripts/contract_test.sh
