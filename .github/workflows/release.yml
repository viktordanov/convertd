# Release (ledger item 007, INTERFACES.md §14). A tag vX.Y.Z on a commit whose Cargo.toml says
# X.Y.Z does this, in order:
#   1. version: checks the tag against Cargo.toml.
#   2. build: builds the runtime image natively on amd64 and arm64 and runs the image gates
#      (.github/actions/image-gates, as image.yml does). Nothing is pushed yet.
#   3. push: builds the same image again from the gate build's cache, checks that it is the
#      gated image (the same config digest), and pushes it by digest to
#      ghcr.io/<owner>/rs-convert. No tag yet.
#   4. publish: one multi-arch manifest, tagged X.Y.Z, and X.Y and latest when this is the
#      newest release of its line and overall. An existing X.Y.Z is never overwritten.
#   5. release: a GitHub release for the tag, with generated notes.
# workflow_dispatch is a dry run: steps 1 and 2 only, on the chosen ref. It never logs in to
# a registry, pushes or releases.
# Actions are pinned by commit SHA (the tag is in the comment), as in image.yml.
name: release

on:
  push:
    # Matches v1.2.3, not client/v1.2.3 (the Go module's tags) or a tag without v.
    tags: ["v*.*.*"]
  workflow_dispatch: {}

# Each job asks for what it needs; nothing is granted by default.
permissions: {}

# One release run per ref at a time, and never cancelled halfway through a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash          # bash -eo pipefail

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
      newest: ${{ steps.v.outputs.newest }}
      newest_in_minor: ${{ steps.v.outputs.newest_in_minor }}
      epoch: ${{ steps.v.outputs.epoch }}
      build_date: ${{ steps.v.outputs.build_date }}
      image: ${{ steps.v.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0       # the tags decide whether X.Y and latest move
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # The version of the [package] table, as build_docker.sh reads it.
          version="$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml | head -n1)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml [package] version '${version}' is not X.Y.Z"
            exit 1
          fi
          if [[ "${EVENT}" == push ]]; then
            if [[ "${REF_TYPE}" != tag || "${REF_NAME}" != "v${version}" ]]; then
              echo "::error::the tag ${REF_NAME} is not v${version}, the Cargo.toml version"
              exit 1
            fi
          fi
          minor="${version%.*}"
          # X.Y and latest move only to the newest release: of its X.Y line, and overall. A
          # patch to an older line (1.0.5 after 1.1.0) moves neither. The tag of this run counts
          # even when it is not pushed yet (a dry run).
          releases="$( { git tag -l 'v*.*.*'; echo "v${version}"; } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV)"
          newest="$(tail -n1 <<<"${releases}")"
          newest_in_minor="$(grep -F "v${minor}." <<<"${releases}" | grep -E "^v${minor//./\\.}\.[0-9]+$" | tail -n1)"
          {
            echo "version=${version}"
            echo "minor=${minor}"
            echo "newest=$([[ "${newest}" == "v${version}" ]] && echo true || echo false)"
            echo "newest_in_minor=$([[ "${newest_in_minor}" == "v${version}" ]] && echo true || echo false)"
            echo "epoch=$(git log -1 --format=%ct)"
            echo "build_date=$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)"
            # GHCR names are lowercase; the owner name may not be.
            echo "image=ghcr.io/${OWNER,,}/rs-convert"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    # Build and gate, without any registry credential.
    needs: version
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: true      # a release needs both architectures
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}   # native: no emulation
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Guard, as in image.yml: build from a checkout with the modes that umask 077 gives.
      - name: Make the checkout private (umask 077 modes)
        run: chmod -R go-rwx "${GITHUB_WORKSPACE}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Fixed timestamps in the image config, so the push job's rebuild has the same
          # config digest when it reuses these layers.
          SOURCE_DATE_EPOCH: ${{ needs.version.outputs.epoch }}
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          build-args: |
            CARGO_JOBS=4
            CONVERTD_VERSION=${{ needs.version.outputs.version }}
            CONVERTD_COMMIT=${{ github.sha }}
            CONVERTD_BUILD_DATE=${{ needs.version.outputs.build_date }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          provenance: false
          load: true
          push: false
          tags: rs-convert:release
      - uses: ./.github/actions/image-gates
        with:
          image: rs-convert:release
          arch: ${{ matrix.arch }}
          max-mb: ${{ vars.IMAGE_MAX_MB || 635 }}
      # The push job checks that it pushes this image: its config digest.
      - name: Record the gated config digest
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          [[ "${IMAGE_ID}" == sha256:* ]] || { echo "::error::no image id from the build"; exit 1; }
          echo "${IMAGE_ID}" > "${RUNNER_TEMP}/gated-${{ matrix.arch }}"
          echo "gated linux/${{ matrix.arch }}: ${IMAGE_ID}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gated-${{ matrix.arch }}
          path: ${{ runner.temp }}/gated-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  push:
    # Only a tag push gets here; a dry run stops after build.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, build]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ${{ needs.version.outputs.image }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same modes as the build job, or COPY layers would differ and miss its cache.
      - name: Make the checkout private (umask 077 modes)
        run: chmod -R go-rwx "${GITHUB_WORKSPACE}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gated-${{ matrix.arch }}
          path: ${{ runner.temp }}/gated
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: docker login ghcr.io --username "${ACTOR}" --password-stdin <<<"${TOKEN}"
      - name: Refuse to overwrite an existing release
        run: |
          if out="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>&1)"; then
            echo "::error::${IMAGE}:${VERSION} already exists; a release is never overwritten"
            exit 1
          fi
          # Only "not found" means absent. Any other failure (auth, network) stops the release.
          grep -qiE 'not found|manifest unknown|name unknown' <<<"${out}" \
            || { echo "::error::cannot tell whether ${IMAGE}:${VERSION} exists: ${out}"; exit 1; }
          echo "${IMAGE}:${VERSION} does not exist yet"
      # The same build as the build job, from its cache: every layer is reused, and
      # SOURCE_DATE_EPOCH fixes the config's timestamps. The push is by digest only, with
      # provenance and an SBOM, as build_docker.sh pushes.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ needs.version.outputs.epoch }}
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          build-args: |
            CARGO_JOBS=4
            CONVERTD_VERSION=${{ needs.version.outputs.version }}
            CONVERTD_COMMIT=${{ github.sha }}
            CONVERTD_BUILD_DATE=${{ needs.version.outputs.build_date }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ needs.version.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      # A rebuild that missed the cache would push an image the gates never saw. Its digest
      # is untagged, so stopping here publishes nothing.
      - name: Check that the pushed image is the gated one
        env:
          PUSHED_ID: ${{ steps.build.outputs.imageid }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gated="$(cat "${RUNNER_TEMP}/gated/gated-${{ matrix.arch }}")"
          if [[ "${PUSHED_ID}" != "${gated}" ]]; then
            echo "::error::linux/${{ matrix.arch }}: pushed config ${PUSHED_ID}, gated ${gated}"
            exit 1
          fi
          [[ "${DIGEST}" == sha256:* ]] || { echo "::error::no digest from the push"; exit 1; }
          echo "${DIGEST}" > "${RUNNER_TEMP}/digest-${{ matrix.arch }}"
          echo "linux/${{ matrix.arch }}: ${IMAGE}@${DIGEST} (config ${PUSHED_ID})" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, push]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      IMAGE: ${{ needs.version.outputs.image }}
      VERSION: ${{ needs.version.outputs.version }}
      MINOR: ${{ needs.version.outputs.minor }}
      NEWEST: ${{ needs.version.outputs.newest }}
      NEWEST_IN_MINOR: ${{ needs.version.outputs.newest_in_minor }}
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: docker login ghcr.io --username "${ACTOR}" --password-stdin <<<"${TOKEN}"
      - id: manifest
        name: Publish the multi-arch manifest
        run: |
          amd64="$(cat "${RUNNER_TEMP}/digests/digest-amd64")"
          arm64="$(cat "${RUNNER_TEMP}/digests/digest-arm64")"
          # Checked again just before the tags are written: a release is never overwritten.
          if out="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>&1)"; then
            echo "::error::${IMAGE}:${VERSION} already exists; a release is never overwritten"
            exit 1
          fi
          grep -qiE 'not found|manifest unknown|name unknown' <<<"${out}" \
            || { echo "::error::cannot tell whether ${IMAGE}:${VERSION} exists: ${out}"; exit 1; }
          tags=(--tag "${IMAGE}:${VERSION}")
          [[ "${NEWEST_IN_MINOR}" == true ]] && tags+=(--tag "${IMAGE}:${MINOR}")
          [[ "${NEWEST}" == true ]] && tags+=(--tag "${IMAGE}:latest")
          docker buildx imagetools create "${tags[@]}" "${IMAGE}@${amd64}" "${IMAGE}@${arm64}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "${digest}" == sha256:* ]] || { echo "::error::no digest for ${IMAGE}:${VERSION}"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "Published ${IMAGE}@${digest} as: ${tags[*]//--tag /}"
            docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    needs: [version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          NEWEST: ${{ needs.version.outputs.newest }}
        run: |
          notes="Image: \`${IMAGE}:${VERSION}\` (linux/amd64, linux/arm64), \`${IMAGE}@${DIGEST}\`."
          gh release create "${TAG}" --repo "${REPO}" --verify-tag --title "${TAG}" \
            --notes "${notes}" --generate-notes --latest="${NEWEST}"
