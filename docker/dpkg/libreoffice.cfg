# Installed as /etc/dpkg/dpkg.cfg.d/92-rs-convert-libreoffice (product and dev, so the engine
# tests see the same LibreOffice). dpkg never unpacks a matching path. Patterns are fnmatch
# without FNM_PATHNAME ("*" matches "/"). A later path-include wins.
# Each block names what LibreOfficeKit headless never loads, and its size on 26.8.3 aarch64
# (du of the unpacked .debs). Plan 003 step 4 proves each block with the A/B gate in
# docker/README.md before it stays.

# Icon themes, 68.9 MB. svp (headless) uses colibre, LibreOffice's fallback theme, for the few
# icons that can reach a page (form controls, the missing-image placeholder). Keep it, and only
# its PNG variant.
path-exclude=/opt/libreoffice*/share/config/images_*
path-include=/opt/libreoffice*/share/config/images_colibre.zip

# Offline help, 25.1 MB. Only the help viewer reads it.
path-exclude=/opt/libreoffice*/help/*

# Gallery (clip art, sounds, backgrounds), 13.3 MB. Read only by the Gallery and Fontwork
# dialogs; a document carries its own copy of what it uses.
path-exclude=/opt/libreoffice*/share/gallery/*

# Document templates, 8.0 MB. Read only when a user creates a document from a template.
path-exclude=/opt/libreoffice*/share/template/*

# Basic wizards, 4.9 MB. Macros are off (lane 002's lock-down), and the wizards are UI.
path-exclude=/opt/libreoffice*/share/wizards/*

# The credits document, 2.0 MB. LICENSE, LICENSE.html and NOTICE stay.
path-exclude=/opt/libreoffice*/CREDITS.fodt

# Pending, decided in the build: LibreOffice's copies of the families that Debian packages
# already install (Liberation, Carlito, Caladea, the six DejaVu core faces, Noto Sans and Serif
# Regular/Bold/Italic/BoldItalic), about 16 MB. The copy that fc-match picks today stays, so the
# metrics do not change, and build-info.json must stay identical.
