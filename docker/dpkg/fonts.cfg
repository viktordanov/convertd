# Installed as /etc/dpkg/dpkg.cfg.d/91-convertd-fonts (product and dev, so both see the same
# families). Keeps only the Noto families that docker/README.md lists. The fc-list gate in install-engines.sh
# fails the build if a promised family is missing.
path-exclude=/usr/share/fonts/truetype/noto/*
path-include=/usr/share/fonts/truetype/noto/NotoSansMono-*
path-include=/usr/share/fonts/truetype/noto/NotoSansSymbols-*
path-include=/usr/share/fonts/truetype/noto/NotoSansSymbols2-*
path-include=/usr/share/fonts/truetype/noto/NotoSansMath-*
path-include=/usr/share/fonts/truetype/noto/NotoColorEmoji*

# Scripts that no other font in the image has. Without a font, a run
# in the script renders blank or as wrong glyphs, the PDF text layer still holds it, and no
# warning is raised. One Sans family per script, Regular and Bold, from fonts-noto-core, which
# is installed anyway. Devanagari is not here: LibreOffice's own Noto Sans 2.x covers it, and
# the coverage gate in install-engines.sh fails the build if that ever stops.
path-include=/usr/share/fonts/truetype/noto/NotoSansThai-*
path-include=/usr/share/fonts/truetype/noto/NotoSansEthiopic-*
# The other scripts of living languages with official status somewhere: the Indic scripts,
# Sinhala, Khmer, Myanmar, Tibetan (Serif only in Debian), Thaana, Syriac, Mongolian,
# Cherokee, Yi and Ol Chiki. Each is a few hundred KB. Drop this block to save its size; then
# these scripts render blank again.
path-include=/usr/share/fonts/truetype/noto/NotoSansBengali-*
path-include=/usr/share/fonts/truetype/noto/NotoSansGujarati-*
path-include=/usr/share/fonts/truetype/noto/NotoSansGurmukhi-*
path-include=/usr/share/fonts/truetype/noto/NotoSansKannada-*
path-include=/usr/share/fonts/truetype/noto/NotoSansMalayalam-*
path-include=/usr/share/fonts/truetype/noto/NotoSansOriya-*
path-include=/usr/share/fonts/truetype/noto/NotoSansTamil-*
path-include=/usr/share/fonts/truetype/noto/NotoSansTelugu-*
path-include=/usr/share/fonts/truetype/noto/NotoSansSinhala-*
path-include=/usr/share/fonts/truetype/noto/NotoSansKhmer-*
path-include=/usr/share/fonts/truetype/noto/NotoSansMyanmar-*
path-include=/usr/share/fonts/truetype/noto/NotoSerifTibetan-*
path-include=/usr/share/fonts/truetype/noto/NotoSansThaana-*
path-include=/usr/share/fonts/truetype/noto/NotoSansSyriac-*
path-include=/usr/share/fonts/truetype/noto/NotoSansMongolian-*
path-include=/usr/share/fonts/truetype/noto/NotoSansCherokee-*
path-include=/usr/share/fonts/truetype/noto/NotoSansYi-*
path-include=/usr/share/fonts/truetype/noto/NotoSansOlChiki-*

# fonts-wqy-microhei (install-engines.sh) is a coverage fallback for CJK only. Its fontconfig
# file would put it in front of sans-serif if anything enabled it, which would move the
# substitutes in build-info.json. Nothing enables it on trixie; drop it anyway.
path-exclude=/usr/share/fontconfig/conf.avail/65-wqy-microhei.conf

# Duplicate fonts: LibreOffice's ooofonts ship the same families. On 26.8.3.1 fontconfig picks
# LibreOffice's copy of each of these (the same version, or a newer one: Caladea 65602 against
# 65601, Noto Sans and Serif 132055 against 131334), so the Debian files never render. The
# packages stay for their fontconfig rules; only the font files go. Noto Sans and Noto Serif
# come only from LibreOffice now, which is why they are not included above.
# docker/dpkg/libreoffice.cfg drops the one family where Debian's copy wins, Carlito.
path-exclude=/usr/share/fonts/truetype/liberation/*
path-exclude=/usr/share/fonts/truetype/dejavu/*
path-exclude=/usr/share/fonts/truetype/crosextra/Caladea-*
