[package]
name = "corpus-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Checks the rs-convert corpus and measures the service (ledger item 005)"
publish = false

# A workspace of its own: this crate stays out of convertd's lock file
# (plan 005 section 1), and the root manifest never builds it.
[workspace]

[[bin]]
name = "corpus-bench"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
jsonschema = { version = "0.63.1", default-features = false }
lopdf = { version = "0.47.0", default-features = false }
# Plain HTTP to a loopback or private target: no TLS, no proxy.
reqwest = { version = "0.13.5", default-features = false, features = ["multipart", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["rt", "time", "fs"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
