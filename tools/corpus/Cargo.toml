[package]
name = "corpus-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
description = "Checks the convertd corpus and measures the service"
publish = false

# A workspace of its own: this crate stays out of convertd's lock file
#, and the root manifest never builds it.
[workspace]

[[bin]]
name = "corpus-bench"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
jsonschema = { version = "0.63.1", default-features = false }
lopdf = { version = "0.47.0", default-features = false }
# Plain HTTP to a loopback or private target: no TLS, no proxy.
reqwest = { version = "0.13.5", default-features = false, features = ["multipart", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["rt", "time", "fs"] }
# Bundles are ustar in one zstd frame.
tar = { version = "0.4.46", default-features = false }
zstd = { version = "0.14.5", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
