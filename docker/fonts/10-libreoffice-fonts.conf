<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Installed as /etc/fonts/conf.d/10-rs-convert-libreoffice-fonts.conf.
     Makes LibreOffice's bundled fonts (ooofonts, and OpenSymbol in core) system fonts, so
     fc-cache puts them in the system cache at build time and build-info.json lists them.
     LibreOffice registers these two directories itself, by their real path
     (/opt/libreoffice26.8/...). fontconfig keys its cache on the path as written, so
     install-engines.sh rewrites the version-free /opt/libreoffice/ prefix below to the real
     directory before fc-cache runs. Otherwise each worker writes a user cache at start. -->
<fontconfig>
  <dir>/opt/libreoffice/share/fonts/truetype</dir>
  <dir>/opt/libreoffice/program/resource/common/fonts</dir>
</fontconfig>
