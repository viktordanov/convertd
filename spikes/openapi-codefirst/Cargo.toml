[package]
name = "spike-openapi-codefirst"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-axum = "0.3"
