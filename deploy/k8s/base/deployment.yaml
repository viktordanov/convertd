# deploy/k8s/base/deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convertd
spec:
  replicas: 1                       # minimum 1: workers take time to warm (PLAN.md:541)
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0             # the new pod is ready before the old one drains
  selector:
    matchLabels:
      app.kubernetes.io/name: convertd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: convertd
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # preStop (5) + SHUTDOWN_GRACE_SECONDS (210) + margin (15). See plan.md, Decision 1.
      terminationGracePeriodSeconds: 230
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault       # container runtime default filter, not item 006
      containers:
        - name: convertd
          image: rs-convert
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef: {name: convertd-api-key, key: API_KEY}
            - name: API_KEY_PREVIOUS
              valueFrom:
                secretKeyRef: {name: convertd-api-key, key: API_KEY_PREVIOUS, optional: true}
            - {name: LOG_MODE, value: prod}
            - {name: TMP_DIR, value: /tmp/convert}
            # Explicit: with no CPU limit, "half the cores" would read the node's cores.
            - {name: OFFICE_WORKERS, value: "1"}
            - {name: RENDER_WORKERS, value: "2"}
            - {name: TIMEOUT_MAX_SECONDS, value: "210"}
            # convertd refuses to start if TIMEOUT_DEFAULT_SECONDS > TIMEOUT_MAX_SECONDS. Set it
            # with the maximum: an overlay that lowers the maximum below 120 lowers this too.
            - {name: TIMEOUT_DEFAULT_SECONDS, value: "120"}
            - {name: SHUTDOWN_GRACE_SECONDS, value: "210"}
            # The run-time disk budget for everything under TMP_DIR (lane 001). It MUST stay
            # below sizeLimit minus the headroom (1 GiB for worker slots, profiles and logs):
            # TMP_MAX_BYTES <= 4Gi - 1Gi. Change them together, or a full volume evicts the pod.
            - {name: TMP_MAX_BYTES, value: "3221225472"}     # 3 GiB
            # The memory budget of the workers. Each worker may grow to WORKER_KILL_RSS_MB (MiB)
            # before the watchdog kills it, so all of them together MUST fit in the memory limit:
            # (OFFICE_WORKERS + RENDER_WORKERS) x WORKER_KILL_RSS_MB + 512 MiB <= limits.memory.
            # 3 x 1152 + 512 = 3968 MiB <= 4096 MiB. Change the worker counts, these two values and
            # the memory limit together: a container OOM can kill every job in the pod. Measured on
            # the 59-case corpus (2026-11-26): office peak 533 MiB, render 109 MiB, supervisor
            # 17 MiB. WORKER_MAX_RSS_MB recycles a worker after a job above it.
            - {name: WORKER_KILL_RSS_MB, value: "1152"}
            - {name: WORKER_MAX_RSS_MB, value: "768"}
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 4Gi       # = sizeLimit: the scheduler reserves the whole volume
            limits:
              memory: 4Gi                # no CPU limit on purpose: CFS throttling adds latency
              ephemeral-storage: 4Gi       # = request = sizeLimit; logs fit in the 1 GiB headroom
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:                  # up to 120 s for the first warm worker per pool
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:                 # supervisor only; a busy pool never restarts the pod
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: {seconds: 5}        # endpoint removal propagates before SIGTERM; K8s >= 1.30
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi               # TMP_MAX_BYTES (3 GiB) + 1 GiB headroom (slots, profiles, logs); node disk
