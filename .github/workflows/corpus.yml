name: corpus

# Regenerates the test corpus with its pinned packages and compares every
# file with the SHA-256 in corpus/expected.json. Runs only when the corpus
# or this workflow changes; the Rust jobs live in image.yml.
on:
  pull_request:
    paths: ["corpus/**", ".github/workflows/corpus.yml"]
  push:
    branches: [main]
    paths: ["corpus/**", ".github/workflows/corpus.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hashes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: corpus/requirements.txt
      - name: Corpus files match expected.json
        run: corpus/check.sh python
      - name: Shell scripts
        run: shellcheck corpus/check.sh
