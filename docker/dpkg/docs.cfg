# Installed as /etc/dpkg/dpkg.cfg.d/90-rs-convert-docs (product image only).
# dpkg never unpacks a matching path. Patterns are fnmatch without FNM_PATHNAME ("*" matches "/").
# A later path-include wins. Not used in the dev image, where locale-gen needs locale files.
path-exclude=/usr/share/doc/*
path-include=/usr/share/doc/*/copyright
path-exclude=/usr/share/man/*
path-exclude=/usr/share/info/*
path-exclude=/usr/share/lintian/*
path-exclude=/usr/share/locale/*
path-include=/usr/share/locale/locale.alias
path-exclude=/usr/share/icons/*
path-exclude=/usr/share/applications/*
