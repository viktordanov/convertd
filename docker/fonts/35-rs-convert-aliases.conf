<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Installed in /etc/fonts/conf.d/.
     Debian's fontconfig and font packages already alias Calibri -> Carlito, Cambria -> Caladea
     and Arial, Times New Roman, Courier New -> Liberation (30-metric-aliases.conf and the
     fonts-crosextra-* conf files). These are the Office families with no metric-compatible free
     font; they get the closest one instead. Not metric-compatible, so fonts.json marks them
     false. build-info.json font_substitutes records what fc-match actually picks, aliases
     included, so this file and the warnings cannot disagree. -->
<fontconfig>
  <alias binding="same"><family>Aptos</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Aptos Display</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Calibri Light</family><prefer><family>Carlito</family></prefer></alias>
</fontconfig>
