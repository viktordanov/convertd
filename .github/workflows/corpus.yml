name: corpus

# Regenerates the test corpus with its pinned packages and compares every
# file with the SHA-256 in corpus/expected.json, and lints and tests
# corpus-bench (tools/corpus). Runs only when the corpus, corpus-bench or
# this workflow changes; the convertd Rust jobs live in image.yml.
on:
  pull_request:
    paths: ["corpus/**", "tools/corpus/**", ".github/workflows/corpus.yml"]
  push:
    branches: [main]
    paths: ["corpus/**", "tools/corpus/**", ".github/workflows/corpus.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hashes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The same pin as image.yml: a runner image update cannot change the result.
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: corpus/requirements.txt
      - name: Corpus files match expected.json
        run: corpus/check.sh python
      - name: Install shellcheck
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Shell scripts
        run: /usr/local/bin/shellcheck corpus/check.sh

  bench:
    # corpus-bench's own checks. Its tests read corpus/expected.json and
    # expected.schema.json, so a change under either path runs them. They need
    # no network, no Docker and no image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image job's pin, with clippy and rustfmt in the same install, so no
      # later step installs a component implicitly (an arm64 run once failed with
      # a conflict on bin/cargo-clippy). RUSTUP_TOOLCHAIN overrides rust-toolchain.toml.
      - name: Install Rust 1.99.0 (minimal profile, clippy, rustfmt)
        run: |
          rustup --version
          if ! rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt --no-self-update; then
            echo "retrying after removing the partial 1.99.0 install"
            rustup toolchain uninstall 1.99.0 || true
            rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt --no-self-update
          fi
          echo "RUSTUP_TOOLCHAIN=1.99.0" >> "$GITHUB_ENV"
          rustup run 1.99.0 cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "tools/corpus -> target"
          shared-key: corpus-bench
      - name: Format
        run: cargo fmt --manifest-path tools/corpus/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path tools/corpus/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path tools/corpus/Cargo.toml --locked
