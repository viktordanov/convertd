# CI for the image and the deployment files (ledger item 003, INTERFACES.md §14).
# CI builds and tests; it never pushes. Releases stay manual: tag v<x.y.z>, run
# build_docker.sh (PLAN.md:377). The image job is manual and monthly until plan 003 step 7.
# Actions are pinned by commit SHA (the tag is in the comment); tools by version and SHA-256.
# Not here yet (wave two, once they exist on main): 005's corpus-bench validate and
# generate.py --check.
name: image

on:
  # Docs-only changes (ledger, guidance, READMEs) skip this workflow; memoria.yml checks them.
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  schedule:
    - cron: "0 4 1 * *"      # monthly rebuild and scan: Debian security updates, broken pins
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# For the Rust jobs; the image job ignores them.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash          # bash -eo pipefail: a failing smoke or kubeconform fails through pipes

jobs:
  # Rust checks run as two parallel jobs with a shared dependency cache. Debug info and
  # incremental builds are off in CI: they cost build time and nothing reads them here.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup is on the runner; rust-toolchain.toml pins the channel and components.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features test-hooks -- -D warnings

  test:
    # One test run, with the test hooks: it is a superset of the plain build's tests, and
    # clippy above already proves the plain build compiles. Tests named slow_* run only in
    # test-full. nextest kills a test after 60 s (.config/nextest.toml, profile ci).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-nextest@0.9.152
      - name: Test
        run: cargo nextest run --locked --features test-hooks --profile ci
      - name: Doc tests
        run: cargo test --locked --features test-hooks --doc
      # The Go steps reuse the test-hooks convertd that the tests above built, so
      # neither generate.sh nor contract_test.sh compiles Rust again.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: |
            client/go.sum
            client/contract/go.sum
      - name: Generated files are current
        run: ./generate.sh --check
      - name: Contract tests (level A fake)
        run: scripts/contract_test.sh

  test-full:
    # Every test, including slow_*: by hand and monthly.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-nextest@0.9.152
      - name: Test
        run: cargo nextest run --locked --features test-hooks --profile full

  image:
    # Manual and monthly only for now: the smoke test needs `convertd serve` with real engines
    # and corpus/smoke/small.docx, neither of which exists yet. Plan 003 step 7 (smoke test and
    # CI, wave two) re-enables it on push and pull_request by removing this condition.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}   # native: no emulation anywhere in CI
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # build-push-action, not a `run:` step: the gha cache needs the runtime token it provides.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          build-args: |
            CARGO_JOBS=4
            CONVERTD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          load: true
          push: false
          tags: rs-convert:ci
      - name: Smoke (size, time to ready, one DOCX, font cache)
        env:
          CURL_IMAGE: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
        run: docker/smoke.sh rs-convert:ci corpus/smoke/small.docx "${{ vars.IMAGE_MAX_MB || 600 }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Scan (monthly, report only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {image-ref: "rs-convert:ci", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1"}

  manifests:
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tgz -C /usr/local/bin kubeconform
      - name: Kubernetes manifests render and validate
        run: |
          for o in deploy/k8s/base deploy/k8s/overlays/gvisor; do
            kubectl kustomize "$o" | kubeconform -strict -summary -
          done
          kubeconform -strict -summary deploy/k8s/overlays/gvisor/runtimeclass.yaml
      - name: Bicep compiles
        run: az bicep build --file deploy/aca/main.bicep --stdout >/dev/null
      - name: Shell scripts
        run: shellcheck build_docker.sh docker/*.sh
